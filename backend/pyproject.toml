[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iss-backend"
version = "0.1.0"
description = "Local ISS tracking backend"
authors = [{name = "Codex"}]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-asyncio>=0.23",
  "respx[httpx]>=0.20",
  "ruff>=0.4",
  "black>=24.2"
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "ASYNC",
  "S",
  "RUF"
]

[tool.pytest.ini_options]
testpaths = [
  "app/tests"
]
asyncio_mode = "auto"

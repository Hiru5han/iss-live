name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::549363909845:role/iss-live-github-deploy
          aws-region: us-east-1

      - name: Get API base URL from CloudFormation
        id: api-url
        run: |
          API_NOW_URL=$(aws cloudformation describe-stacks \
            --stack-name IssLiveStack \
            --query "Stacks[0].Outputs[?OutputKey=='IssApiUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")
          API_BASE="${API_NOW_URL%/iss/now}"
          echo "api_base=$API_BASE" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ steps.api-url.outputs.api_base }}
        run: |
          npm ci
          npm run build

      - name: Deploy CDK stack
        run: |
          npm ci
          npx cdk deploy --require-approval never
